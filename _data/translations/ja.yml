  about_title: "RubyConfAfrica 2026へようこそ"
  about_subtitle: "コードの先へ：未来に向けたイノベーション"
  about_content: "<p>今年のテーマは<strong>「コードの先へ：未来に向けたイノベーション」</strong>です。Rubyとオープンソース技術がどのように明日の世界を形作ることができるかに焦点を当てています。ケニアでの2日間のイベントにご参加ください。Rubyへの情熱と有意義な変革を起こす力に駆動された、思想リーダー、イノベーター、起業家が集います。</p><p>コードの先——イノベーションの核心へと踏み込む、先進的な議論、実践的なワークショップ、活気あるネットワーキングセッションに飛び込みましょう。</p>"
