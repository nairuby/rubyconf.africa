practicalities:
  title: "Ruby Conf Africa 2026 実務情報"
  description: "Ruby Conf Africa 2026への参加に必要な実務情報（会場詳細、交通情報、宿泊先など）をご案内します。"
  hero_subtitle: "RubyConf Africa参加のための総合ガイド"
  download_guide: "トラベルガイドをダウンロード"
  intro_update: "<strong>RubyConf Africa 2026</strong>のA-Z完全ガイドをご覧ください。この情報は随時更新されており、イベントが近づくにつれて更新される予定です。最終更新日：<strong>2026年5月5日</strong>。"
  travel_auth_title: "渡航許可"
  travel_auth_subtitle: "Ruby Conf Africa 2026参加のためのケニア渡航"
  visa_text: "ケニアを訪問するすべての旅行者に査証（ビザ）義務はありませんが、不便を避けるために渡航の少なくとも<strong>2週間前</strong>までに<strong>電子渡航認証</strong>（eTA）を取得する必要があります。"
  faq_fee_q: "旅行者のeTA料金はいくらですか？"
  faq_fee_a: "eTA料金は<strong>32.50米ドル</strong>（旅行者1名あたり）に加え、銀行手数料および処理手数料がかかります。"
  faq_who_q: "誰がeTAを申請すべきですか？"
  faq_who_a_1: "有効なケニア永住権、就労許可証、パスを保有する者を除き、すべての外国人訪問者はeTAを申請する必要があります。"
  faq_who_a_2: "以下の<strong>EAC</strong>諸国のパスポート保有者はeTA申請が免除されます：<em>ブルンジ、コンゴ民主共和国、ルワンダ、南スーダン、タンザニア、ウガンダ</em>。"
  faq_who_note: "<strong>重要：</strong> eTA申請では、旅行者の基本情報および適格性に関する質問への回答を収集します。申請は通常<strong>3日以内</strong>に処理されますが、場合によってはさらに時間がかかることがあります。<strong>渡航の2週間前までにeTAを申請することをお勧めします</strong>。渡航の3ヶ月前までに申請することが可能です。"
  faq_who_rec: "宿泊先や交通チケットを予約されましたら、できるだけ早く申請されることを強くお勧めします。"
  faq_how_q: "eTAの申請方法は？"
  faq_how_a: "申請はケニア政府公式電子渡航認証ウェブサイトから行います："
  faq_health_q: "ケニア到着時に提示が必要な健康に関する書類は何ですか？"
  faq_health_a_1: "現在、黄熱病予防接種証明書が必要であり、場合によってはCOVID-19証明書も必要となることがあります。"
  faq_health_a_2: "詳細については、以下の"
  incoming_travellers: "渡航者向け"
  requirements_details: "要件をご参照ください。"
  faq_docs_q: "eTA申請に必要な書類は何ですか？"
  faq_docs_intro: "申請を始める前に、以下の書類をご用意ください："
  doc_passport: "ケニア到着予定日から少なくとも6ヶ月以上の有効期限があり、かつ空きページが1ページ以上ある有効なパスポート。"
  doc_photo: "最近のパスポート写真、または申請プロセス中に撮影した自撮り写真。"
  doc_contact: "連絡先詳細（自宅住所、電話番号、メールアドレス）。"
  doc_travel_info: "旅行情報およびフライト旅程（到着便番号、乗り継ぎがある場合は最初の便の出発日）。"
  doc_booking: "滞在予定ホテルの予約証明（友人宅に滞在する場合は招待状でも可）。"
  doc_payment: "該当する場合、クレジット/デビットカード情報（支払い用）。"
  doc_invitation: "カンファレンスの招待状または参加証明書。"
  doc_invitation_note: "カンファレンスの招待状または参加証明書を取得するには、"
  conference_letter_form: "カンファレンスレター依頼フォーム"
  to_provide_letter: "にご記入いただき、レターを入手してください。"
  speakers_guide_title: "渡航スピーカー向けガイド！"
  speakers_guide_text: "スピーカーの皆様の渡航費や宿泊費をカバーできないことをあらかじめご了承ください。そのため、フライトやホテルの手配はご自身で行っていただく必要があります。この情報が旅行計画に不可欠であることを認識しており、明確にお伝えすることが重要だと考えております。"
  hotel_title: "ホテル推奨リスト"
  hotel_text: "会場から徒歩圏内の厳選された高評価ホテルをご紹介します。さまざまなご希望や予算に対応しており、滞在中の利便性と快適さを保証いたします。ご質問はまでお問い合わせください。"
  hotel_button: "ホテル詳細推奨リストを見る"
  attractions_title: "ケニアの観光名所"
  attractions_subtitle: "海外からのスピーカー＆ゲスト向けガイド"
  nairobi_park: "<strong>ナイロビ国立公園：</strong> ナイロビ中心部から車ですぐの場所で、ライオン、シマウマ、キリン、サイを観察できます。"
  giraffe_centre: "<strong>キリンセンター：</strong> この非営利の保護施設で、絶滅危惧種のロスチャイルドキリンと間近で触れ合えます。"
  sheldrick_trust: "<strong>デイビッド・シェルドリック野生生物基金：</strong> ゾウの孤児院を訪れ、ゾウの救出と保護活動について学べます。"
  museum: "<strong>ナイロビ国立博物館：</strong> ケニアの豊かな歴史と文化に浸れます。"
  karen_blixen: '<strong>カレン・ブリクセン博物館：</strong> 「アフリカの日々」の著者の家を訪れます。'
  bomas: "<strong>ケニアのボマス：</strong> 伝統的なケニアの文化をダンスや実演で体験できます。"
  uhuru_park: "<strong>ウフル公園：</strong> 湖とボート乗り場があるナイロビ最大の公園でリラックスできます。"
  maasai_mara: "<strong>マサイマラ国立保護区：</strong> 圧巻のヌー大移動を目撃できます。"
  amboseli: "<strong>アンボセリ国立公園：</strong> キリマンジャロ山を背景にゾウの群れを鑑賞できます。"
  lake_nakuru: "<strong>ナクル湖国立公園：</strong> 壮大なフラミンゴの集結を見られます。"
  karura: "<strong>カルラの森：</strong> 広大な原生林でのハイキングやサイクリングが楽しめます。"
  ngong_hills: "<strong>ンゴング丘陵：</strong> グレートリフトバレーの景色を望むハイキングやジップラインアドベンチャーが楽しめます。"
  shopping: "<strong>ショッピング：</strong> マサイマーケットのような活気ある市場や高級モールを探索できます。"
  final_note_title: "これはあくまでも出発点です！"
  final_note_text: "ケニアには他にも数多くの魅力的な観光地があります。ぜひ旅行代理店にご相談いただくか、オンラインでさらに調査して、ご自身の興味やスケジュールに合った体験を見つけてください。<strong>ケニアでの時間をお楽しみください！</strong>"

code_of_conduct_page:
  title: "Ruby Conf Africa 2026 行動規範"
  description: "Ruby Conf Africa 2026の行動規範をご覧ください。全ての参加者に安全で居心地の良い環境を提供することに取り組んでいます。"
  hero_title: "行動規範"
  hero_subtitle: "Ruby Conf Africa 2026"
  hero_description: "全ての参加者に安全で居心地の良い環境を提供することに取り組んでいます。コミュニティの基準をご理解いただくために、行動規範をご一読ください。"
  commitment_title: "私たちの約束"
  commitment_text: "アフリカRubyコミュニティは、性自認およびその表現、性的指向、障がい、ニューロダイバーシティ、外見、体格、民族、国籍、人種、年齢、宗教、その他の保護カテゴリーに関わらず、全ての人にとってハラスメントのないインクルーシブなイベント体験を提供することに尽力します。"
  expected_behavior_title: "期待される行動"
  be_excellent_title: "お互いに素晴らしくあろう"
  be_excellent_text: "性自認およびその表現、性的指向、障がい、ニューロダイバーシティ、外見、体格、民族、国籍、人種、年齢、宗教、その他の保護カテゴリーに関わらず、全ての人にとって素晴らしい体験となることを願っています。全ての人を尊重して扱いましょう。誰もがここにいる権利があり、私たち一人ひとりがハラスメント、差別、見下し（露骨なものかマイクロアグレッションかを問わず）を恐れずに体験を楽しむ権利があることを認識しながら参加してください。"
  speak_up_title: "何かを見たり聞いたりしたら声をあげる"
  speak_up_text: "ハラスメントは容認されません。あなた自身や他の誰かが無礼な扱いを受けた場合、礼儀正しく介入する権限があなたにはあります。あなたを不快にさせている相手は自分の行動に気づいていないかもしれません。礼儀正しくその行動に注意を向けることを推奨します。ハラスメントを受けている、または不快に感じている場合、他の誰かがハラスメントを受けていることに気づいた場合、その他懸念がある場合は、すぐにイベントスタッフに連絡してください。"
  unacceptable_behavior_title: "許容されない行動"
  harassment_text: "ハラスメントは容認されず、以下を含みますがこれらに限定されません："
  harassment_1: "支配の社会的構造を強化する言語表現"
  harassment_2: "公共スペースでの性的イメージ"
  harassment_3: "故意の脅迫、ストーカー行為、またはつきまとい"
  harassment_4: "迷惑な写真撮影や録音"
  harassment_5: "トークやその他のイベントの継続的な妨害"
  harassment_6: "不適切な身体的接触および歓迎されない性的注意"
  harassment_compliance: "ハラスメント行為の停止を求められた参加者は、直ちに従うことが期待されます。"
  scope_title: "適用範囲"
  scope_text_1: "このポリシーは、トーク、フォーラム、ワークショップ、コードラボ、ソーシャルメディア、パーティー、廊下での会話、全ての参加者、パートナー、スポンサー、ボランティア、イベントスタッフなどに適用されます。"
  scope_text_2: "アフリカRubyコミュニティは、アフリカRubyコミュニティ主催のいかなるイベント（将来のイベントを含む）への入場を拒否したり、任意の人物をいつでも独自の裁量で退場させる権利を留保します。"
  zero_tolerance: "<strong>ゼロトレランスポリシー</strong>とは、イベントコミュニティガイドラインおよびハラスメント防止ポリシーの違反に関するすべての申し立てを調査・審査し、適切に対応することを意味します。"
  partners_title: "出展パートナーおよびスポンサー"
  partners_text: "出展パートナー、スポンサー、またはベンダーブース、類似の活動もこのポリシーの対象となります。特に、出展者は性的な画像、活動、その他の資料を使用してはなりません。ブーススタッフ（ボランティアを含む）は、性的な服装/ユニフォーム/コスチュームを使用したり、その他の方法で性的な雰囲気を作り出したりしてはなりません。"
  why_important_title: "このポリシーが重要な理由"
  why_important_text: "イベントやオンラインコミュニティにおけるハラスメントは残念ながら一般的です。公式ポリシーを策定することで、いかなる理由であれ誰かへのハラスメントが私たちのイベントやコミュニティ内で許容されないことを明確にし、この状況を改善することを目指しています。このポリシーは、行動の期待を明確に定義することでハラスメントを防止し、安心感を提供し、他のイベントで嫌な経験をした人々がこのイベントに参加することを促進します。"
  license_title: "ライセンスと帰属表示"
  license_text_1: "このポリシーは"
  license_link_text: "クリエイティブ・コモンズ・ゼロライセンス"
  license_text_2: "の下でライセンスされています。このポリシーは、Ohio LinuxFestのハラスメント防止ポリシー、Con Anti-Harassment Project、Geek Feminism Wiki（Ada Initiativeによって作成された）、ConfCodeofConduct.com、JSconf、Rust、Diversity in Python、Write/Speak/Codeなど、他のいくつかのコミュニティポリシーに基づいており、それらの影響を受けています。"

