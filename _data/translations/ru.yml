practicalities:
  title: "Практическая информация для Ruby Conf Africa 2026"
  description: "Вся необходимая практическая информация для посещения Ruby Conf Africa 2026: детали о площадке, транспорт и проживание."
  hero_subtitle: "Ваш полный гид по участию в RubyConf Africa"
  download_guide: "Скачать путеводитель"
  intro_update: "Ознакомьтесь с нашим подробным путеводителем для <strong>RubyConf Africa 2026</strong>. Мы постоянно обновляем эту информацию, так что ожидайте обновлений по мере приближения мероприятия. Последнее обновление: <strong>5 мая 2026 года</strong>."
  travel_auth_title: "Разрешения на въезд"
  travel_auth_subtitle: "Поездка в Кению на Ruby Conf Africa 2026"
  visa_text: "Для путешественников, посещающих Кению, виза не требуется, однако вы должны оформить <strong>Электронное разрешение на въезд</strong> (eTA) как минимум за <strong>2 недели</strong> до поездки в Кению, чтобы избежать неудобств."
  faq_fee_q: "Какова стоимость eTA для путешественников?"
  faq_fee_a: "Стоимость eTA составляет <strong>32,50 USD</strong> на путешественника плюс банковские и комиссионные сборы."
  faq_who_q: "Кто должен подавать заявку на eTA?"
  faq_who_a_1: "Все иностранные посетители должны подать заявку на eTA, за исключением владельцев действительных видов на постоянное проживание в Кении, разрешений на работу и пропусков."
  faq_who_a_2: "Владельцы паспортов следующих стран <strong>EAC</strong> освобождены от подачи заявки на eTA: <em>Бурунди, Демократическая Республика Конго, Руанда, Южный Судан, Танзания и Уганда</em>."
  faq_who_note: "<strong>Важное примечание:</strong> Заявка на eTA собирает биографическую информацию и ответы на вопросы об eligibility от путешественника. Заявки обычно обрабатываются в течение <strong>3 дней</strong>, но в некоторых случаях это может занять больше времени. <strong>Мы рекомендуем подавать заявку на eTA за 2 недели до поездки</strong>. Вы можете подать заявку за 3 месяца до поездки."
  faq_who_rec: "Мы настоятельно рекомендуем подавать заявку сразу после бронирования проживания и билетов на транспорт."
  faq_how_q: "Как подать заявку на eTA?"
  faq_how_a: "Заявки подаются через официальный сайт Электронного разрешения на въезд Кении:"
  faq_health_q: "Какие медицинские документы мне нужны для въезда в Кению?"
  faq_health_a_1: "В настоящее время требуется сертификат о вакцинации против жёлтой лихорадки, а в некоторых случаях также может потребоваться сертификат о вакцинации против COVID-19."
  faq_health_a_2: "Пожалуйста, обратитесь к этим"
  incoming_travellers: "Въезжающим путешественникам"
  requirements_details: "требованиям для получения дополнительной информации."
  faq_docs_q: "Какие документы нужны для подачи заявки на eTA?"
  faq_docs_intro: "Пожалуйста, подготовьте следующие документы перед началом подачи заявки:"
  doc_passport: "Действительный загранпаспорт сроком не менее шести (6) месяцев после запланированной даты прибытия в Кению, с как минимум одной чистой страницей."
  doc_photo: "Недавняя фотография на паспорт ИЛИ селфи-фотография, сделанная во время подачи заявки."
  doc_contact: "Контактные данные (домашний адрес, телефон, электронная почта)."
  doc_travel_info: "Информация о поездке и маршруте полёта (номер рейса прибытия, дата вылета первоначального рейса в случае пересадок)."
  doc_booking: "Подтверждение бронирования отеля, в котором вы будете проживать (при проживании у друзей принимается пригласительное письмо)."
  doc_payment: "Информация о кредитной/дебетовой карте для оплаты (при необходимости)."
  doc_invitation: "Приглашение на конференцию или письмо об участии."
  doc_invitation_note: "Для получения приглашения на конференцию или письма об участии заполните"
  conference_letter_form: "форму запроса на письмо о конференции"
  to_provide_letter: "чтобы мы предоставили вам письмо."
  speakers_guide_title: "Руководство для приезжающих спикеров!"
  speakers_guide_text: "Обратите внимание, что, к сожалению, мы не можем покрыть расходы на проезд или проживание для спикеров. Поэтому вам необходимо самостоятельно организовать перелёты и проживание в отеле. Мы понимаем, что эта информация важна для планирования поездки, и считаем необходимым сообщить об этом чётко."
  hotel_title: "Рекомендации по отелям"
  hotel_text: "Мы подобрали выбор лучших отелей, все в непосредственной близости от нашей площадки. Учитывая различные предпочтения и бюджеты, эти варианты обеспечат удобство и комфорт во время вашего пребывания. По любым вопросам пишите нам по адресу"
  hotel_button: "Посмотреть подробные рекомендации по отелям"
  attractions_title: "Туристические достопримечательности Кении"
  attractions_subtitle: "Путеводитель для иностранных спикеров и гостей"
  nairobi_park: "<strong>Национальный парк Найроби:</strong> Увидьте львов, зебр, жирафов и носорогов всего в нескольких минутах езды от центра Найроби."
  giraffe_centre: "<strong>Центр жирафов:</strong> Познакомьтесь поближе с находящимися под угрозой исчезновения жирафами Ротшильда в этом некоммерческом заповеднике."
  sheldrick_trust: "<strong>Фонд Дэвида Шелдрика по защите дикой природы:</strong> Посетите питомник и узнайте о спасении и реабилитации слонов."
  museum: "<strong>Национальный музей Найроби:</strong> Погрузитесь в богатую историю и культуру Кении."
  karen_blixen: '<strong>Музей Карен Бликсен:</strong> Посетите дом автора книги «Из Африки».'
  bomas: "<strong>Бомас Кении:</strong> Познакомьтесь с традиционной культурой Кении через танцы и демонстрации."
  uhuru_park: "<strong>Парк Ухуру:</strong> Отдохните в крупнейшем парке Найроби с озером и прогулками на лодках."
  maasai_mara: "<strong>Национальный заповедник Масаи-Мара:</strong> Станьте свидетелем захватывающей миграции антилоп гну."
  amboseli: "<strong>Национальный парк Амбосели:</strong> Полюбуйтесь слонами на фоне горы Килиманджаро."
  lake_nakuru: "<strong>Национальный парк Озеро Накуру:</strong> Увидьте впечатляющие скопления фламинго."
  karura: "<strong>Лес Карура:</strong> Прогуляйтесь или покатайтесь на велосипеде по этому обширному коренному лесу."
  ngong_hills: "<strong>Холмы Нгонг:</strong> Совершите поход или зиплайн-приключение с видами на Великую рифтовую долину."
  shopping: "<strong>Шопинг:</strong> Исследуйте яркие рынки, такие как рынок Масаи, или первоклассные торговые центры."
  final_note_title: "Помните, это лишь отправная точка!"
  final_note_text: "В Кении есть множество других достопримечательностей. Обязательно проконсультируйтесь с турагентом или проведите дополнительное исследование онлайн, чтобы найти впечатления, соответствующие вашим интересам и временным рамкам. <strong>Наслаждайтесь пребыванием в Кении!</strong>"

code_of_conduct_page:
  title: "Кодекс поведения Ruby Conf Africa 2026"
  description: "Ознакомьтесь с кодексом поведения Ruby Conf Africa 2026. Мы стремимся обеспечить безопасную и гостеприимную атмосферу для всех участников."
  hero_title: "Кодекс поведения"
  hero_subtitle: "Ruby Conf Africa 2026"
  hero_description: "Мы стремимся обеспечить безопасную и гостеприимную атмосферу для всех участников. Ознакомьтесь с нашим кодексом поведения, чтобы понять наши стандарты сообщества."
  commitment_title: "Наше обязательство"
  commitment_text: "Африканское Ruby-сообщество стремится обеспечить свободное от домогательств и инклюзивное мероприятие для всех, независимо от гендерной идентичности и самовыражения, сексуальной ориентации, инвалидности, нейроразнообразия, внешности, размера тела, этнической принадлежности, национальности, расы, возраста, религии или других защищённых категорий."
  expected_behavior_title: "Ожидаемое поведение"
  be_excellent_title: "Будьте великодушны друг к другу"
  be_excellent_text: "Мы хотим, чтобы мероприятие было отличным опытом для всех, независимо от гендерной идентичности и самовыражения, сексуальной ориентации, инвалидности, нейроразнообразия, внешности, размера тела, этнической принадлежности, национальности, расы, возраста, религии или других защищённых категорий. Относитесь ко всем с уважением. Участвуйте, признавая, что каждый заслуживает быть здесь, и каждый из нас имеет право наслаждаться опытом без страха преследования, дискриминации или высокомерия, будь то явного или через микроагрессии."
  speak_up_title: "Говорите, если вы видите или слышите что-то"
  speak_up_text: "Домогательства недопустимы, и вы имеете право вежливо вмешаться, когда вы или другие сталкиваетесь с неуважением. Человек, который заставляет вас чувствовать себя некомфортно, может не осознавать, что делает, и вежливое обращение внимания на его поведение приветствуется. Если вы подвергаетесь домогательствам или чувствуете дискомфорт, замечаете, что кто-то ещё подвергается домогательствам, или у вас есть другие проблемы, немедленно свяжитесь с членом организационного комитета."
  unacceptable_behavior_title: "Недопустимое поведение"
  harassment_text: "Домогательства недопустимы и включают, но не ограничиваются:"
  harassment_1: "Вербальные высказывания, усиливающие социальные структуры доминирования"
  harassment_2: "Сексуальные изображения в общественных местах"
  harassment_3: "Преднамеренное запугивание, преследование или слежка"
  harassment_4: "Назойливая фото- или видеосъёмка"
  harassment_5: "Систематическое нарушение хода докладов или других мероприятий"
  harassment_6: "Неуместный физический контакт и нежелательное сексуальное внимание"
  harassment_compliance: "Участники, которых попросили прекратить любое домогательное поведение, обязаны немедленно подчиниться."
  scope_title: "Область действия"
  scope_text_1: "Эта политика распространяется на доклады, форумы, мастер-классы, лаборатории кода, социальные сети, вечеринки, разговоры в коридорах, всех участников, партнёров, спонсоров, волонтёров, организационный комитет и т.д."
  scope_text_2: "Африканское Ruby-сообщество оставляет за собой право отказать в допуске или удалить любое лицо с любого мероприятия, проводимого Африканским Ruby-сообществом (включая будущие мероприятия), в любое время по своему усмотрению."
  zero_tolerance: "<strong>Наша политика абсолютной нетерпимости</strong> означает, что мы расследуем и рассматриваем каждое заявление о нарушении наших Руководящих принципов сообщества и Политики против домогательств и реагируем соответствующим образом."
  partners_title: "Партнёры-экспоненты и спонсоры"
  partners_text: "Партнёры-экспоненты, спонсоры или выставочные стенды, а также аналогичные мероприятия также подпадают под действие этой политики. В частности, экспоненты не должны использовать сексуализированные изображения, мероприятия или другие материалы. Персонал стендов (включая волонтёров) не должен использовать сексуализированную одежду/униформу/костюмы или иным образом создавать сексуализированную атмосферу."
  why_important_title: "Почему эта политика важна"
  why_important_text: "Домогательства на мероприятиях и в онлайн-сообществах, к сожалению, распространены. Создание официальной политики направлено на улучшение ситуации, чётко заявляя, что домогательства к кому-либо по любой причине неприемлемы в рамках наших мероприятий и сообществ. Эта политика может предотвратить домогательства, чётко определяя ожидания в отношении поведения, призвана обеспечить уверенность и поощряет людей, у которых был негативный опыт на других мероприятиях, к участию в этом."
  license_title: "Лицензия и атрибуция"
  license_text_1: "Эта политика лицензируется в соответствии с"
  license_link_text: "лицензией Creative Commons Zero"
  license_text_2: "Эта политика основана на политиках других сообществ, включая политику против домогательств Ohio LinuxFest, проект Con Anti-Harassment, вики Geek Feminism (созданную Ada Initiative), ConfCodeofConduct.com, JSconf, Rust, Diversity in Python и Write/Speak/Code."

