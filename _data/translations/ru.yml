  about_content: "<p>Тема этого года — <strong>«За пределами кода: инновации для будущего»</strong> — подчёркивает, как Ruby и технологии с открытым исходным кодом могут формировать мир завтрашнего дня. Присоединяйтесь к нам в Кении на двухдневное мероприятие, которое объединяет лидеров мнений, новаторов и предпринимателей, движимых страстью к Ruby и его способности вдохновлять на значимые перемены.</p><p>Погрузитесь в прогрессивные дискуссии, практические мастер-классы и яркие нетворкинг-сессии, которые выходят за пределы кода — в самое сердце инноваций.</p>"
